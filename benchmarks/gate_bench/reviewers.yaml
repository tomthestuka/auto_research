# Reviewer roster for the model-swap leg (paper item 2, second panel).
#
# The defects are planted by hand rather than produced by an authoring session, so §9.3's
# author↔reviewer pairing does not exist here and an Anthropic reviewer is admissible in a way it
# is not in production. What this leg measures is therefore reviewer-model SENSITIVITY, not
# provider decorrelation.
#
# Parameters are harmonised on purpose: each member gets a comparable reasoning effort and enough
# output budget to write a full verdict, expressed in each provider's own vocabulary. Running the
# models at their production role settings would compare configurations (`gpt-5.6-luna` ships as a
# 2048-token status monitor) rather than models.
roles:
  bench_reviewer:
    members:
      - name: gpt_5_6_sol
        provider: openai
        model: gpt-5.6-sol
        vision: true
        documents: true
        priceMTk: {input: 5.0, output: 30.0}
        parameters:
          max_output_tokens: 16384
          reasoning: {effort: high}
      - name: gpt_5_6_terra
        provider: openai
        model: gpt-5.6-terra
        vision: true
        documents: true
        priceMTk: {input: 5.0, output: 30.0}
        parameters:
          max_output_tokens: 16384
          reasoning: {effort: high}
      - name: gpt_5_6_luna
        provider: openai
        model: gpt-5.6-luna
        vision: false
        documents: false
        priceMTk: {input: 0.5, output: 4.0}
        parameters:
          max_output_tokens: 16384
          reasoning: {effort: high}
      - name: claude_opus_5
        provider: anthropic
        model: claude-opus-5
        vision: true
        documents: true
        priceMTk: {input: 5.0, output: 25.0}
        parameters:
          max_tokens: 21000  # shares budget with adaptive thinking; 21333 non-streaming ceiling
          thinking: {type: adaptive}
      - name: claude_sonnet_5
        provider: anthropic
        model: claude-sonnet-5
        vision: true
        documents: true
        priceMTk: {input: 3.0, output: 15.0}
        parameters:
          max_tokens: 21000
          thinking: {type: adaptive}
      # ── Added 2026-08-26: the three Responses-dialect vendors ──────────────
      # The lead x co-lead grid (papers/FANGZ DOCS §8.5) found reviewer identity to be the only
      # axis that moves review outcomes, with GPT rejecting 20/20 first submissions against 0-7%
      # for these three. That grid cannot say whether GPT catches more or over-rejects, because
      # every cell reviews its own authoring session and no two reviewers ever see the same code.
      # This roster is where that is settled: one fixed corpus, planted defects, matched controls.
      #
      # Prices are omitted where litellm carries the model (checked 2026-08-26: it prices
      # `qwen3.8-max` and `deepseek-v4-pro`, and returns a zero-rate config stub for `glm-5.3`),
      # since a hand-copied rate that shadows a maintained one is a liability.
      #
      # `reasoning: {effort: high}` and `max_output_tokens: 16384` mirror the OpenAI members, so a
      # swap compares models rather than configurations. This review is text-only (the harness
      # sends no images or documents), so the media flags are capability declarations rather than
      # functional requirements.
      - name: glm_5_3
        provider: zai
        model: glm-5.3
        vision: true
        documents: false
        priceMTk: {input: 1.4, output: 4.4, cache_read: 0.26}   # Z.AI's own page; litellm has no entry
        parameters:
          max_output_tokens: 16384
          reasoning: {effort: high}
      - name: qwen3_8_max
        provider: dashscope
        model: qwen3.8-max
        vision: true
        documents: false
        parameters:
          max_output_tokens: 16384
          reasoning: {effort: high}
      # DeepSeek is declared text-only by the standing policy of 2026-08-25 (its only multimodal
      # model is experimental and this project declines it), not by absent vendor capability.
      # NOTE: in the grid this member failed 5 of 20 reviews with "provider returned no structured
      # output for ToolReviewVerdict" -- a 25 per cent hard failure on long ReAct trajectories that
      # a nine-schema probe on short conversations did not reveal. A gate_bench review is a shorter
      # exchange, so it may not recur here; if it does, its n is what suffers and the run must say so.
      - name: deepseek_v4_pro
        provider: deepseek
        model: deepseek-v4-pro
        vision: false
        documents: false
        parameters:
          max_output_tokens: 16384
          reasoning: {effort: high}
