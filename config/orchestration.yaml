# Iteration caps for the Phase 1 research loop.
#
# max_iterations: how many times the reviewer can send work back on each
#   feedback edge (literature re-search, analysis rework). Hard cap per edge.
# debate_max_rounds: how many rounds analyst workers debate before the lead
#   adjudicates regardless of convergence. Hard cap inside consensus.
#
# io_search_max_iterations: stub (Phase 1 value: 1). When activated in Phase 2,
#   controls how many times the IO lead may refine and re-run the search strategy
#   before handing results to the searcher. Loop lives inside ingest_results().

# Runtime data directory (outside both repos; not committed).
# Holds the SQLite DB, figures/artifacts, run logs, cost ledger, and reviewer reports.
# Must be a path you can write to.
runtime_dir: /data/fzhou/ar_runtime/test_runtime

max_iterations: 3
debate_max_rounds: 3
io_search_max_iterations: 1  # Phase 2 stub — evaluate_search_results() currently returns accepted=True
tool_retry_cap: 3            # (legacy) accepted by DebateToConverge, now unused — the react loop self-corrects
# MEMO (deferred, not a Phase-2 task): these ReAct caps are *backstops against
# pathology*, not workflow budgets — p95 of legitimate runs should finish well
# under them. Lesson from the 2026-06-12 Cyg X-1 run: a single global cap is the
# anti-pattern — at 12 it both burned ~$20 on the librarian loop (each search
# re-bills a growing 20-paper context) AND truncated an analyst worker's output
# (worker 2 hit 12/12 and never reached plot_iqu). Now split per-role. Future
# hardening: make a token/cost/wall-clock BUDGET the primary guard and keep these
# step counts as the secondary backstop (the industry trend, e.g. Claude Agent SDK).
react_loop_cap: 30           # max tool iterations per agent inner ReAct loop before it must report
librarian_react_loop_cap: 1  # tighter cap for the librarian literature loop — each search re-sends the
                             # growing 20-paper abstract context, so unbounded refinement is costly
structured_retry_cap: 2      # attempts for a structured _call (off-schema feedback loop) before raising
toolkit_root: /data/fzhou/research_toolkit
# Python environment used for sandbox tool execution.
# Must be a conda/venv prefix whose Python has the analysis stack (XSPEC, HEASoft, ixpeobssim, etc.).
# The subprocess inherits the parent process environment so HEADAS/CALDB/LD_LIBRARY_PATH are available.
analyze_env: /grad/fzhou/.conda/envs/astropy
# Dedicated headless analyst env script sourced before each tool subprocess.
# Injects HEASoft (HEADAS), CALDB, and related vars without interactive cruft
# (no SSH agent, no gnome-keyring, no competing conda activation).
# See src/auto_research/sandbox/analyst_env.sh.
analyze_ini_sh: /nfsdata1/fzhou/auto_research/src/auto_research/sandbox/analyst_env.sh
# MCP servers to expose to analyst workers alongside TOOL_MANIFEST tools.
# Each entry: {name, command, args}.  Omit or leave empty to use only the
# built-in server (bash_exec, list_dir, read_file).
mcp_servers: []
# Tools to suppress from the catalogue and is_known() regardless of what
# research_toolkit exposes.  Add tool names here to hide broken or deprecated
# tools without touching the toolkit repo.
disabled_tools: []
# Report composition (compose_report graph node, runs on accepted verdicts).
# report_formats: which output handles to produce. Options: 'jsonl' (machine/upstream),
#   'tex' (LaTeX + pdflatex PDF for human review). Both by default.
# report_retry_cap: max LaTeX compile+ref-check iterations before accepting residual errors.
report_formats: [jsonl, tex]
report_retry_cap: 2
