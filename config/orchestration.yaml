# Iteration caps for the Phase 1 research loop.
#
# max_iterations: how many times the reviewer can send work back on each
#   feedback edge (literature re-search, analysis rework). Hard cap per edge.
# debate_max_rounds: how many rounds analyst workers debate before the lead
#   adjudicates regardless of convergence. Hard cap inside consensus.
#
# io_search_max_iterations: stub (Phase 1 value: 1). When activated in Phase 2,
#   controls how many times the IO lead may refine and re-run the search strategy
#   before handing results to the searcher. Loop lives inside ingest_results().

# Runtime data directory (outside both repos; not committed).
# Holds the SQLite DB, figures/artifacts, run logs, cost ledger, and reviewer reports.
# Must be a path you can write to.
runtime_dir: /data/fzhou/ar_runtime/test_runtime
# Paper artifact directory — where PDFs downloaded from literature sources are stored.
# Defaults to <runtime_dir>/papers when absent.
papers_dir: /data/fzhou/ar_runtime/papers

max_iterations: 3
debate_max_rounds: 3
io_search_max_iterations: 1  # Phase 2 stub — evaluate_search_results() currently returns accepted=True
tool_retry_cap: 3            # (legacy) accepted by DebateToConverge, now unused — the react loop self-corrects
# MEMO (deferred, not a Phase-2 task): these ReAct caps are *backstops against
# pathology*, not workflow budgets — p95 of legitimate runs should finish well
# under them. Lesson from the 2026-06-12 Cyg X-1 run: a single global cap is the
# anti-pattern — at 12 it both burned ~$20 on the librarian loop (each search
# re-bills a growing 20-paper context) AND truncated an analyst worker's output
# (worker 2 hit 12/12 and never reached plot_iqu). Now split per-role. Future
# hardening: make a token/cost/wall-clock BUDGET the primary guard and keep these
# step counts as the secondary backstop (the industry trend, e.g. Claude Agent SDK).
react_loop_cap: 30           # max budget-consuming tool iterations per agent inner ReAct loop
react_loop_absolute_cap: 60  # hard ceiling on TOTAL iterations incl. budget-free ones (the lead's
                             # §5.5 plan_and_debate design rounds don't count toward react_loop_cap,
                             # only toward this runaway backstop; the human ends the debate normally)
librarian_react_loop_cap: 1  # tighter cap for the librarian literature loop — each search re-sends the
                             # growing 20-paper abstract context, so unbounded refinement is costly
structured_retry_cap: 2      # attempts for a structured _call (off-schema feedback loop) before raising
# Global default sandbox per-tool-call timeout (seconds): a tool call is SIGTERM-killed at this
# many seconds (exit 124) unless its package raises it. This is the protective short cap for quick
# tools. A genuinely slow tool overrides it per tool in its package <domain>_utils/tool_config.yaml
# (key call_timeout_s: {<tool>: <seconds>}), which takes precedence over this value. No hard upper
# bound on the per-tool override — tool_config.yaml is trusted infra, never LLM-set.
sandbox_call_timeout_s: 300
toolkit_root: /data/fzhou/research_toolkit
# Python environment used for sandbox tool execution.
# Must be a conda/venv prefix whose Python has the analysis stack (XSPEC, HEASoft, ixpeobssim,
# astroquery for heasarc_utils downloads, etc.).
# The subprocess inherits the parent process environment so HEADAS/CALDB/LD_LIBRARY_PATH are available.
analyze_env: /grad/fzhou/.conda/envs/astropy
# Dedicated headless analyst env script sourced before each tool subprocess.
# Injects HEASoft (HEADAS), CALDB, and related vars without interactive cruft
# (no SSH agent, no gnome-keyring, no competing conda activation).
# See src/auto_research/sandbox/analyst_env.sh.
analyze_ini_sh: /nfsdata1/fzhou/auto_research/src/auto_research/sandbox/analyst_env.sh
# Filesystem allow-list for EVERY runtime agent (coder + reviewer + lead + workers), enforced by
# auto_research.sandbox.fs_guard.PathGuard. This is the COMPLETE set of absolute roots an agent may
# read/write; the system's own auto_research repo is deliberately absent (the §2/§4 trust boundary
# — agents can never read orchestration code or governance files). Portability: this is the one
# list to edit when moving machines. It MUST include toolkit_root and runtime_dir (so agents can
# read their own workspace), plus the obs-db root, the analyst conda env, HEASoft HEADAS + CALDB,
# the local writeable PFILES dir, and /tmp. HEADAS/CALDB roots cover all their subdirs by
# containment. An empty/unset list disables the guard (allow-all). Governance basenames
# (CLAUDE.md/DOCS.md/AGENTS.md) are denied even inside an allowed root.
agent_fs_allow:
  - /data/fzhou/research_toolkit          # toolkit_root (the coder's worktree lives here)
  - /data/fzhou/XSPEC/Cyg_X-1             # obs_db_root (config/observations.yaml)
  - /grad/fzhou/.conda/envs/astropy       # analyze_env (analyst conda + science stack)
  - /opt/heasoft/heasoft-6.34/x86_64-pc-linux-gnu-libc2.34   # HEADAS (HEASoft install tree)
  - /man1/CALDB                           # CALDB
  - /grad/fzhou/pfiles                    # local PFILES (HEASoft writes parameter files here)
  - /data/fzhou/ar_runtime/test_runtime   # runtime_dir (per-run scratch, figures, logs)
  - /tmp
# MCP servers to expose to analyst workers alongside TOOL_MANIFEST tools.
# Each entry: {name, command, args}.  Omit or leave empty to use only the
# built-in server (bash_exec, list_dir, read_file).
mcp_servers: []
# Tools to suppress from the catalogue and is_known() regardless of what
# research_toolkit exposes.  Add tool names here to hide broken or deprecated
# tools without touching the toolkit repo.
disabled_tools: []
# Report composition (compose_report graph node, runs on accepted verdicts).
# report_formats: which output handles to produce. Options: 'jsonl' (machine/upstream),
#   'tex' (LaTeX + pdflatex PDF for human review). Both by default.
# report_retry_cap: max LaTeX compile+ref-check iterations before accepting residual errors.
report_formats: [jsonl, tex]
report_retry_cap: 2
# Phase 2 tool-authoring (merge_flow.propose_and_pr) caps. Like the ReAct caps above,
# these are BACKSTOPS AGAINST PATHOLOGY, not workflow budgets — a healthy authoring run
# finishes well under them. tool_author_max_turns bounds the Sonnet author's own
# self-correction loop (L0, SDK turns); the two rework caps bound how many times the
# author is re-driven after a gate rejection (L2) or a co-lead review rejection (L3)
# before the lead raises the failure to the human (§9.6/§9.7).
tool_author_max_turns: 999
tool_author_gate_rework_cap: 3
tool_author_review_rework_cap: 2
# Phase 2 step-7 runtime authoring/resume (consensus → merge_flow). tool_author_branch: the
# branch in toolkit_root the runtime commits authored tools onto DIRECTLY (it never merges to
# master — §9.9); the launch preflight asserts research_toolkit is on this branch with a clean
# tree (a dirty tree means a prior terminal authoring failure left edits to inspect). The
# human swaps to this branch and merges out of band. tool_author_cap: max authoring attempts
# per analysis — a BACKSTOP bounding the acquire→reduce→analyse dependency chain, not a budget.
tool_author_branch: ai
tool_author_cap: 6
# Raise-to-human channel (§9.8). human_channel: the default connector used when a run is
# NOT attended (library/notebook/server) and no channel is passed explicitly — one of
# cli|slack|whatsapp|none. Kept `none` (headless) by default so unattended runs and the test
# suite never block on a human; set it to `whatsapp`/`slack` to wire a library run, or pass
# run_research(human_channel=...). An interactive CLI auto-detects the terminal regardless.
# human_channel_ping_timeout_s: how long the launch-time preflight waits for the channel to
# reply back before failing the run (green only when a reply arrives).
# human_response_timeout_s: how long a blocked role waits for a human reply mid-run before
# failing, shared by EVERY channel (cli/slack/whatsapp). A suspend is in-process blocking, so
# this caps how long the run holds the process on a person. Default 3600s (1h) is a humane
# window; it is deliberately NOT tied to the LLM prompt-cache TTL (the default cache is only
# ~5min and exceeding it just costs one cheap cold prefix re-prefill on resume, not a re-run).
human_channel: none
human_channel_ping_timeout_s: 60
human_response_timeout_s: 3600
