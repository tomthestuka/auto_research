# Orchestration config for the research loop. Grouped by area; each comment says what the
# key does (+ unit/default). Design rationale lives in CLAUDE.md, not here.

# ── Paths (outside both repos; not committed) ──
runtime_dir: /data/fzhou/ar_runtime/test_runtime   # SQLite DB, figures, run logs, cost ledger, reports
papers_dir: /data/fzhou/ar_runtime/papers          # downloaded paper PDFs (default: <runtime_dir>/papers)
toolkit_root: /data/fzhou/research_toolkit          # research_toolkit checkout (the coder's worktree)
analyze_env: /grad/fzhou/.conda/envs/astropy        # conda prefix with the analysis stack (XSPEC/HEASoft/ixpeobssim)
analyze_ini_sh: /nfsdata1/fzhou/auto_research/src/auto_research/sandbox/analyst_env.sh  # headless env sourced per tool subprocess (HEADAS/CALDB, no interactive cruft)
repl_init_py: /nfsdata1/fzhou/auto_research/src/auto_research/sandbox/repl_init.py       # python exec'd at REPL-subprocess boot (domain session setup); empty/absent ⇒ no-op
analyze_probe: "import xspec, xspec_utils"  # one-line python smoke-test run under analyze_env (installer + preflight); empty ⇒ skip

# ── Feedback-loop caps (hard backstops against pathology, not workflow budgets) ──
max_iterations: 3            # reviewer→work send-backs per feedback edge (literature / analysis)
debate_max_rounds: 3         # analyst debate rounds before the lead adjudicates
io_search_max_iterations: 1  # Phase-2 stub — evaluate_search_results() returns accepted=True
tool_retry_cap: 3            # legacy, unused (the ReAct loop self-corrects)

# ── ReAct loop caps (per-role step-count backstops; a token/cost budget is the intended future primary guard) ──
react_loop_cap: 400            # budget-consuming tool iterations per agent loop
react_loop_absolute_cap: 600   # hard ceiling incl. budget-free iterations (lead's §5.5 plan_and_debate rounds count only here)
librarian_react_loop_cap: 1   # tighter — each librarian search re-sends the growing paper context
status_react_loop_cap: 6      # /status reporter — tight; a human is waiting on a phone
structured_retry_cap: 4       # off-schema retries for a structured _call before raising

# ── Run ledger (monitor JSONL) field caps (characters; a longer field is trimmed with a
#    "[+N chars]" marker so what was dropped stays countable) ──
# The ledger is the run's durable record, so these bound what an OFFLINE scoring/audit pass can
# still read months later. The read side is capped separately (MonitorToolProvider windows an
# event payload), so raising these never widens what an agent can pull into its own context.
ledger_arg_cap: 100000         # tool-call arguments recorded per event
ledger_result_cap: 100000      # tool-result text recorded per event
ledger_coder_text_cap: 100000  # coder prose / tool input / tool result (both author harnesses)
gate_layer_b_output_cap: 100000  # pytest output kept on a Layer-B failure, so the traceback survives

# ── Internet stability (transient LLM-provider failures: overloaded / rate-limit / 5xx / connection drops) ──
provider_retry_max: 8                # retries per model call after the first failure; non-transient errors raise at once
provider_retry_base_cooldown_s: 60   # first cooldown; doubles each retry, jittered down so agents desynchronize
provider_retry_max_cooldown_s: 600   # cooldown ceiling

# ── Context management (Anthropic provider-native context editing; beta — clears stale tool results server-side on long loops) ──
context_mgmt_enabled: true                 # live-verified 2026-07-28
context_mgmt_trigger_tokens: 120000        # clear oldest tool results once a request exceeds this many input tokens
context_mgmt_clear_at_least_tokens: 20000  # clear at least this per pass (amortizes the cache-prefix invalidation)
context_mgmt_keep_tool_uses: 3             # keep this many most-recent tool results verbatim

# ── Tool search / lazy loading (provider-native; toolkit tools load on demand, harness tools stay resident) ──
tool_search_enabled: true                  # live-verified 2026-07-28 on both providers

# ── Sandbox / gate timeouts (seconds; a package may raise its own in <domain>_utils/tool_config.yaml, which wins — no upper clamp, trusted infra, never LLM-set) ──
sandbox_call_timeout_s: 300   # per tool-call wall-clock; SIGTERM (exit 124) past this
gate_test_timeout_s: 900      # per pytest invocation in the gate's Layer-B (run twice)

# ── Filesystem allow-list for EVERY runtime agent (fs_guard.PathGuard) ──
# The complete set of absolute roots an agent may read/write. auto_research is deliberately ABSENT
# (§2/§4 trust boundary). Edit this one list when moving machines; empty/unset ⇒ guard off.
# Governance basenames (CLAUDE.md/DOCS.md/AGENTS.md) are denied even inside an allowed root.
agent_fs_allow:
  - /data/fzhou/research_toolkit          # toolkit_root (coder's worktree)
  - /data/fzhou/XSPEC/Cyg_X-1             # obs_db_root (observations.yaml)
  - /grad/fzhou/.conda/envs/astropy       # analyze_env
  - /opt/heasoft/heasoft-6.34/x86_64-pc-linux-gnu-libc2.34   # HEADAS
  - /opt/heasoft/heasoft-6.34                                # HEASoft release root: PyXspec's
                                                             # files symlink out of HEADAS into
                                                             # Xspec/… , so the jail needs both
  - /man1/CALDB                           # CALDB
  - /grad/fzhou/pfiles                    # local PFILES (HEASoft parameter files)
  - /data/fzhou/ar_runtime/test_runtime/runs   # run WORKSPACES only — the ledger,
                                              # backend.log and checkpoint live in
                                              # ../ledgers/, deliberately out of reach
  - /tmp

# ── OS-level filesystem jail (§12) ──
agent_os_jail: true           # wrap runtime subprocesses in bwrap, confined to the lists below
agent_fs_readonly:            # subset of agent_fs_allow the jail mounts read-only
  - /grad/fzhou/.conda/envs/astropy                          # analyze_env
  - /opt/heasoft/heasoft-6.34/x86_64-pc-linux-gnu-libc2.34   # HEADAS
  - /opt/heasoft/heasoft-6.34                                # HEASoft release root
  - /man1/CALDB                                              # CALDB

# ── Tool discovery ──
mcp_servers: []      # extra MCP servers for workers ({name,command,args}); empty ⇒ built-in only (bash_exec/list_dir/read_file)
disabled_tools: [research_toolkit.heasarc_utils.acquire]   # tool names to hide from the catalogue regardless of what the toolkit exposes

# ── Report composition (compose_report node, on accepted verdicts) ──
report_formats: [tex]   # output handles: jsonl (machine), tex (LaTeX+PDF)
report_retry_cap: 2            # LaTeX compile+ref-check iterations before accepting residual errors

# ── Phase-2 tool authoring (backstops, not budgets; §9.3/§9.9) ──
tool_author_max_turns: 999            # Sonnet author's own SDK self-correction turns (L0)
tool_author_submit_cap: 5             # lead's submit_for_review calls (each = gate ×2 + co-lead review)
tool_author_debate_cap: 5             # lead↔co-lead respond_to_review turns per tool
tool_author_gate_rework_cap: 5        # legacy propose_and_pr auto-loop (unused on the lead-driven path)
tool_author_review_rework_cap: 5      # legacy propose_and_pr auto-loop (unused on the lead-driven path)
tool_author_branch: ai                # branch the runtime commits onto directly; never merged to master; preflight asserts it's checked out + clean
tool_author_cap: 12                   # authoring attempts per analysis (bounds the acquire→reduce→analyse chain)

# ── Raise-to-human channel (§9.8) ──
# human_channel: default connector for an UNATTENDED run (library/notebook/server) when none is passed
#   — cli|slack|whatsapp|none. `none` ⇒ headless, never blocks. An interactive CLI auto-detects the
#   terminal regardless. Pass run_research(human_channel=...) to wire a library run.
human_channel: none
human_channel_ping_timeout_s: 60      # preflight wait for the channel to reply before failing launch
human_response_timeout_s: 43200       # 12h — mid-run wait for a human reply before failing (all channels, in-process blocking)
