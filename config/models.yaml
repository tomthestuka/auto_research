roles:
  reviewer:
    members:
      - name: claude_fable_5
        provider: anthropic
        model: claude-fable-5
        vision: true
        documents: true
        priceMTk:
          input: 10.0
          output: 50.0
        parameters:
          thinking:
            type: adaptive
          max_tokens: 21000  # required by the API; at the 21333 non-streaming ceiling
      - name: gpt_5_6_sol
        provider: openai
        model: gpt-5.6-sol
        vision: true
        documents: true
        priceMTk:
          input: 5.0
          output: 30.0
        parameters:
          reasoning:
            effort: high
  analyst_lead:
    members:
      - name: claude_opus_5
        provider: anthropic
        model: claude-opus-5
        vision: true
        priceMTk:
          input: 5.0
          output: 25.0
        parameters:
          thinking:
            type: adaptive
          max_tokens: 21000  # required by the API; at the 21333 non-streaming ceiling
  analyst_worker:
    members:
      - name: claude_sonnet_5
        provider: anthropic
        model: claude-sonnet-5
        vision: true
        priceMTk:
          input: 2.0
          output: 10.0
        parameters:
          thinking:
            type: adaptive
          max_tokens: 21000  # required by the API; at the 21333 non-streaming ceiling
      - name: gpt_5_6
        provider: openai
        model: gpt-5.6-terra
        vision: true
        priceMTk:
          input: 5.0
          output: 30.0
        parameters:
          reasoning:
            effort: medium
  # Phase 2 tool-authoring roles (CLAUDE.md §6/§9.3).
  # coder: the author the analyst lead spawns; the member names both model and harness.
  # analyst_colead: the provider-decorrelated tool reviewer. MUST differ from the coder's
  #   provider — two independent checks, not one provider checking its own family.
  coder:
    members: # exactly 1 — one author harness drives one model
      - name: deepseek-v4-flash
        harness: codex       # author process; legal harness/provider pairs: sandbox/coder/harness.py
        provider: deepseek
        model: deepseek-v4-flash
        base_url: https://api.deepseek.com/   # required: the endpoint deepseek documents for codex
  analyst_colead:
    members:
      - name: gpt_5_6
        provider: openai
        model: gpt-5.6-sol
        vision: true
        documents: true
        priceMTk:
          input: 5.0
          output: 30.0
        parameters:
          reasoning:
            effort: high
  librarian_io:
    members:
      - name: claude_sonnet_5
        provider: anthropic
        model: claude-sonnet-5
        vision: false
        documents: true
        priceMTk:
          input: 2.0
          output: 10.0
        parameters:
          thinking:
            type: adaptive
          max_tokens: 21000  # required by the API; at the 21333 non-streaming ceiling
      - name: gpt_5_5_medium
        provider: openai
        model: gpt-5.5
        vision: false
        documents: true
        priceMTk:
          input: 5.0
          output: 30.0
        parameters:
          reasoning:
            effort: medium
      - name: gemini_3_5_flash_thinking
        provider: google
        model: gemini-3.5-flash
        vision: false
        documents: true
        priceMTk:
          input: 1.5
          output: 9.0
        parameters:
          thinking_config:
            thinking_level: high
  # /status HITL command: a light monitor that summarizes the run's event log on demand.
  # Optional — not in REQUIRED_ROLES; /status falls back to a deterministic digest if absent.
  status_monitor:
    members:
      - name: gpt_5_6_luna
        provider: openai
        model: gpt-5.6-luna
        vision: false
        documents: false
        priceMTk:
          input: 0.5
          output: 4.0
        parameters:
          max_output_tokens: 2048
          reasoning:
            effort: low
  # Summarises a finished authoring link's coding transcript into the outcome the lead reads.
  # A bounded single-shot summary against a fixed preserve-list; the verifiable facts (commit
  # sha, gate and review verdicts) are inserted by code, never written by this model.
  # Condenses the middle of a long turn for members whose provider has no server-side compaction
  # (B7). Optional: without it such a turn is not condensed and is recorded as such.
  session_compactor:
    members:
      - name: gpt_5_6_luna
        provider: openai
        model: gpt-5.6-luna
        vision: false
        documents: false
        priceMTk:
          input: 0.5
          output: 4.0
        parameters:
          reasoning:
            effort: low
  compactor:
    members:
      - name: gpt_5_6_luna
        provider: openai
        model: gpt-5.6-luna
        vision: false
        documents: false
        priceMTk:
          input: 0.5
          output: 4.0
        parameters:
          reasoning:
            effort: low
