roles:
  reviewer:
    members:
      - name: claude_opus_4_8
        provider: anthropic
        model: claude-opus-4-8
        vision: true
        documents: true
        priceMTk:
          input: 5.0
          output: 25.0
        parameters:
          max_tokens: 16384  # reviewer composes the full LaTeX report in one call; 4096 truncated it
      - name: gpt_5_5_high
        provider: openai
        model: gpt-5.5
        vision: true
        documents: true
        priceMTk:
          input: 5.0
          output: 30.0
        parameters:
          max_output_tokens: 4096
          reasoning:
            effort: high
      - name: gemini_3_5_flash_high
        provider: google
        model: gemini-3.5-flash
        vision: true
        documents: true
        priceMTk:
          input: 1.5
          output: 9.0
        parameters:
          thinking_config:
            thinking_level: high
  analyst_lead:
    members:
      - name: claude_opus_4_8
        provider: anthropic
        model: claude-opus-4-8
        vision: true
        priceMTk:
          input: 5.0
          output: 25.0
        parameters:
          max_tokens: 16384
  analyst_worker:
    members:
      - name: claude_sonnet_4_6
        provider: anthropic
        model: claude-sonnet-4-6
        vision: true
        priceMTk:
          input: 3.0
          output: 15.0
        parameters:
          max_tokens: 16384
      - name: gpt_5_5_medium
        provider: openai
        model: gpt-5.5
        vision: true
        priceMTk:
          input: 5.0
          output: 30.0
        parameters:
          max_output_tokens: 16384
          reasoning:
            effort: medium
  # Phase 2 tool-authoring roles (CLAUDE.md §6/§9.3).
  # coder: the Sonnet-tier Claude author the analyst lead spawns (Claude Agent SDK).
  # analyst_colead: the provider-decorrelated tool reviewer. MUST stay non-Anthropic
  #   because the coder is Claude — two independent checks, not one provider checking its
  #   own family. Backed by GPT-5.5 reasoning xhigh (cheapest eligible, capable enough).
  coder:
    members:
      - name: claude_sonnet_4_6
        provider: anthropic
        model: claude-sonnet-4-6
        vision: true
        priceMTk:
          input: 3.0
          output: 15.0
        parameters:
          max_tokens: 16384
  analyst_colead:
    members:
      - name: gpt_5_5_xhigh
        provider: openai
        model: gpt-5.5
        vision: true
        documents: true
        priceMTk:
          input: 5.0
          output: 30.0
        parameters:
          max_output_tokens: 16384
          reasoning:
            effort: xhigh
  librarian_io:
    members:
      - name: claude_sonnet_4_6
        provider: anthropic
        model: claude-sonnet-4-6
        vision: false
        documents: true
        priceMTk:
          input: 3.0
          output: 15.0
        parameters:
          max_tokens: 8192
      - name: gpt_5_5_medium
        provider: openai
        model: gpt-5.5
        vision: false
        documents: true
        priceMTk:
          input: 5.0
          output: 30.0
        parameters:
          max_output_tokens: 8192
          reasoning:
            effort: medium
      - name: gemini_3_5_flash_thinking
        provider: google
        model: gemini-3.5-flash
        vision: false
        documents: true
        priceMTk:
          input: 1.5
          output: 9.0
        parameters:
          thinking_config:
            thinking_level: high
