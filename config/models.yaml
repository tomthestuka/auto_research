roles:
  reviewer:
    members:
      - name: claude_fable_5
        provider: anthropic
        model: claude-fable-5
        vision: true
        documents: true
        priceMTk:
          input: 10.0
          output: 50.0
        parameters:
          thinking:
            type: adaptive
          max_tokens: 21000  # shares budget with adaptive thinking; 21333 non-streaming ceiling
      - name: gpt_5_5_high
        provider: openai
        model: gpt-5.5
        vision: true
        documents: true
        priceMTk:
          input: 5.0
          output: 30.0
        parameters:
          max_output_tokens: 4096
          reasoning:
            effort: high
      - name: gemini_3_5_flash_high
        provider: google
        model: gemini-3.5-flash
        vision: true
        documents: true
        priceMTk:
          input: 1.5
          output: 9.0
        parameters:
          thinking_config:
            thinking_level: high
  analyst_lead:
    members:
      - name: claude_opus_4_8
        provider: anthropic
        model: claude-opus-4-8
        vision: true
        priceMTk:
          input: 5.0
          output: 25.0
        parameters:
          thinking:
            type: adaptive
          max_tokens: 21000  # shares budget with adaptive thinking; 21333 non-streaming ceiling
  analyst_worker:
    members:
      - name: claude_sonnet_5
        provider: anthropic
        model: claude-sonnet-5
        vision: true
        priceMTk:
          input: 3.0
          output: 15.0
        parameters:
          thinking:
            type: adaptive
          max_tokens: 21000  # shares budget with adaptive thinking; 21333 non-streaming ceiling
      - name: gpt_5_5_medium
        provider: openai
        model: gpt-5.5
        vision: true
        priceMTk:
          input: 5.0
          output: 30.0
        parameters:
          max_output_tokens: 16384
          reasoning:
            effort: medium
  # Phase 2 tool-authoring roles (CLAUDE.md §6/§9.3).
  # coder: the Sonnet-tier Claude author the analyst lead spawns (Claude Agent SDK).
  # analyst_colead: the provider-decorrelated tool reviewer. MUST stay non-Anthropic
  #   because the coder is Claude — two independent checks, not one provider checking its
  #   own family. Backed by GPT-5.5 reasoning xhigh (cheapest eligible, capable enough).
  coder:
    members: # only 1 allowed here
      - name: claude_sonnet_5
        provider: anthropic
        model: claude-sonnet-5
        vision: true
        priceMTk:
          input: 2.0
          output: 10.0
        parameters:
          max_tokens: 16384
  analyst_colead:
    members:
      - name: gpt_5_5_xhigh
        provider: openai
        model: gpt-5.5
        vision: true
        documents: true
        priceMTk:
          input: 5.0
          output: 30.0
        parameters:
          max_output_tokens: 16384
          reasoning:
            effort: xhigh
  librarian_io:
    members:
      - name: claude_sonnet_4_6
        provider: anthropic
        model: claude-sonnet-4-6
        vision: false
        documents: true
        priceMTk:
          input: 3.0
          output: 15.0
        parameters:
          thinking:
            type: adaptive
          max_tokens: 12000  # shares budget with adaptive thinking (light role; small outputs)
      - name: gpt_5_5_medium
        provider: openai
        model: gpt-5.5
        vision: false
        documents: true
        priceMTk:
          input: 5.0
          output: 30.0
        parameters:
          max_output_tokens: 8192
          reasoning:
            effort: medium
      - name: gemini_3_5_flash_thinking
        provider: google
        model: gemini-3.5-flash
        vision: false
        documents: true
        priceMTk:
          input: 1.5
          output: 9.0
        parameters:
          thinking_config:
            thinking_level: high
  # /status HITL command: a light monitor that summarizes the run's event log on demand.
  # Optional — not in REQUIRED_ROLES; /status falls back to a deterministic digest if absent.
  status_monitor:
    members:
      - name: gpt_5_6_luna
        provider: openai
        model: gpt-5.6-luna
        vision: false
        documents: false
        priceMTk:
          input: 0.5
          output: 4.0
        parameters:
          max_output_tokens: 2048
          reasoning:
            effort: low
