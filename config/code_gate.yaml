# No-fabrication scan lists for the Phase-2 deterministic gate (CLAUDE.md §9.4/§9.5).
# Loaded by src/auto_research/sandbox/gate.py — the single place to tune what the mechanical
# gate rejects vs. flags (config-driven like the model registry; no scan list in source).
# Tiers: HARD-FAIL (Tier 1) flips GateReport.passed=False; FINDING (Tier 3) is recorded and
# routed to the step-4 co-lead reviewer to judge intent, without failing the gate.
# Matching: vocabulary = whole words/phrases (case-insensitive) in COMMENTS/DOCSTRINGS/STRING
# LITERALS of added lines; code patterns = AST of added/new .py files.

# ── Tier 1: banned vocabulary (hard-fail) ──
# Prefer phrases over bare words where a legit collision exists ("dummy data" not "dummy" so
# "dummy variable" survives; "toy data" not "toy"). Banning "synthetic" does NOT catch a
# `synth<YYMMDD>-<sha>` ObsID token, so §9.5 fixtures stay legal via the allowlist below.
hard_fail_vocabulary:
  # fabrication words (bare ambiguous descriptors → finding_vocabulary; see below)
  - example data
  - sample data
  - fake data
  - fake value
  - fake result
  - mock data
  - dummy data
  - made up
  - made-up
  - fabricated
  - fabricate
  - fictional
  - fictitious
  - hardcoded result
  - hard-coded result
  - canned
  - pretend
  - bogus
  - toy data
  # hand-waving / deferral
  - representative data
  - representative value
  - representative result
  - for now
  - in operational mode this would
  - in production this would
  - in practice this would
  - would actually
  - would normally
  - for demonstration
  - for illustration
  - placeholder
  # incompleteness markers
  - TODO
  - FIXME
  - XXX
  - HACK

# ── Tier 1: code patterns (hard-fail) — any RNG, seeded or not ──
# Toolkit code computes deterministic transforms of real data; synthetic data is DATA (a marked
# ObsID), never code (§9.5). A genuine stochastic need surfaces as a rejection the lead/human handles.
hard_fail_code_patterns:

# ── Tier 3: vocabulary (FINDINGS → co-lead review, not hard-fail) ──
# Incompleteness markers + bare ambiguous descriptors that recur in honest §9.5 disclosures.
# A Tier-1 word inside an explicit negation lands here too (clause-scoped, in gate.py).
finding_vocabulary:
  - stub
  - stubbed
  - not implemented
  - to be implemented
  - synthetic
  - synthesized
  - synthesised
  - illustrative

# ── Tier 3: code patterns (FINDINGS → co-lead review, not hard-fail) ──
# Numeric-literal arrays into return / plot / DataFrame — the XSPEC param-vector / energy-bin
# landmine: usually legit parameters, occasionally a fabricated result. Attribute assignments
# (`m.par.values = [...]`) are excluded (never findings).
# Dual-purpose list: `literal_array_*` entries switch on built-in detectors; any other
# entry is a dotted code pattern matched like the hard tier but recorded as a finding.
finding_code_patterns:
  - literal_array_return       # `return [<numeric literals>]`
  - literal_array_plot         # `plt.plot([...], [...])`, scatter, errorbar
  - literal_array_dataframe    # `pd.DataFrame({<hardcoded numbers>})`
  # randomness for monte carlo
  - np.random
  - numpy.random
  - random.random
  - random.randint
  - random.uniform
  - random.normalvariate
  - random.gauss
  - random.choice
  - random.shuffle
  - random.sample
  - random.seed
  - default_rng
  - .rvs            # scipy.stats.<dist>.rvs
  - torch.rand
  - torch.randn
  - torch.randint
  - tf.random

# ── Allowlist: ObsID/path tokens exempt from the vocabulary scan (regex, per line) ──
# Belt-and-suspenders so a marked synth ObsID (§9.5, `synth<YYMMDD>-<sha>`) never trips the scan.
allowlist_obsid_tokens:
  - 'synth\d{6}'
