1name: auto_research
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  # schemas + config + env
  - pydantic>=2.7
  - pyyaml>=6
  - python-dotenv>=1
  # LLM provider SDKs
  - anthropic>=0.40
  - openai>=1.50
  - google-genai>=0.3
  # orchestration + observability
  - langgraph>=0.2
  - langsmith>=0.1.130
  # literature sources
  - arxiv>=2.1
  - ads>=0.12
  - tavily-python>=0.5
  # MCP client
  - mcp>=1.27
  # human-in-the-loop connectors and renders (raise-to-human, §9.8) — optional at runtime, only
  # imported when the corresponding channel is selected.
  - twilio>=9
  - slack-bolt>=1.18
  - python-telegram-bot>=22
  - rich >= 15.0.0
  # tests
  - pytest>=8
  # langgraph-cli and claude-agent-sdk are not on conda-forge.
  - pip:
      - -e .
      - langgraph-cli[inmem]
      - claude-agent-sdk==0.2.99