name: auto_research
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  # schemas + config + env
  - pydantic>=2.7
  - pyyaml>=6
  - python-dotenv>=1
  # LLM provider SDKs
  - anthropic>=0.40
  - openai>=1.50
  - google-genai>=0.3
  # orchestration + observability
  - langgraph>=0.2
  - langsmith>=0.1.130
  - litellm>=1.93   # community per-model price map (incl. cache/reasoning tokens); used for cost only, lazy-imported
  # literature sources
  - arxiv>=2.1
  - ads>=0.12
  - tavily-python>=0.5
  # multimodal request guards (models/providers/_media.py): pillow resizes an image that would
  # breach a provider's dimension/byte limit, pypdf counts PDF pages against the page cap.
  - pillow>=10
  - pypdf>=5
  # MCP client
  - mcp>=1.27
  # human-in-the-loop connectors and renders (raise-to-human, §9.8) — optional at runtime, only
  # imported when the corresponding channel is selected.
  - twilio>=9
  - slack-bolt>=1.18
  - python-telegram-bot>=22
  - rich >= 15.0.0
  - questionary>=2.0   # interactive install.sh prompts (arrow-menus/path entry); lazy-imported
  # tests
  - pytest>=8
  # langgraph-cli, claude-agent-sdk, openai-codex, and langgraph-checkpoint-sqlite are not on
  # conda-forge.
  - pip:
      - -e .
      - langgraph-cli[inmem]
      - claude-agent-sdk==0.2.99
      # Codex author harness (sandbox/coder/codex_sdk.py). Pulls its own version-matched
      # `openai-codex-cli-bin`, which is the binary the SDK's app-server protocol is built against.
      - openai-codex==0.147.0
      - langgraph-checkpoint-sqlite>=3.1   # AsyncSqliteSaver for durable mid-run resume (§12); pulls aiosqlite + sqlite-vec